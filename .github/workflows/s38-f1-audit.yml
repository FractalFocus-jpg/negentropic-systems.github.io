name: S38 F1 Post-terminal Diagnostics

on:
  push:
    branches: ['audit/s38-f1-next-frontier']
    paths:
      - 'frontier/s38_f1/audit.py'
      - 'frontier/s38_f1/test_frontier.py'
      - 'frontier/s38_f1/PROTOCOL.md'
      - '.github/workflows/s38-f1-audit.yml'

permissions:
  contents: read

concurrency:
  group: s38-f1-diagnostic-20260908-001
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Checkout exact diagnostic revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Pinned analysis dependencies
        run: python -m pip install numpy==2.4.6 pandas==3.0.5 scipy==1.17.1 scikit-learn==1.9.0 pytest==9.0.2
      - name: Synthetic regression and custody tests only
        run: python -m pytest frontier/s38_f1/test_frontier.py -q --junitxml=s38-f1-tests.xml
      - name: Reserve before analysis and persist terminal
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python frontier/s38_f1/audit.py --execute 2>&1 | tee s38-f1-console.log
      - name: Preserve diagnostics and reconstruction sources
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s38-f1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            s38-f1-output/
            s38-f1-tests.xml
            s38-f1-console.log
            frontier/s38_f1/
            sp500.csv
            receipts/KFIN-V2_1-20260908-002.json
          retention-days: 90
          overwrite: false
          if-no-files-found: error
